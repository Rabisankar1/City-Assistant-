<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M9 1.5v1.3M2.5 8h1.3M4.4 3.4l.9.9M13.6 3.4l-.9.9"/><path d="M8 20h9a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 8 13.5 3.3 3.3 0 0 0 8 20Z" fill="var(--panel)"/></svg>
        </span>
        <div>
          <h1>City Assistant</h1>
          <p>Live weather and local news for any city</p>
        </div>
      </div>
      <div class="tools">
        <label class="switch" title="Run tools without asking first">
          <input type="checkbox" id="auto" role="switch">
          <span class="track"></span>
          <span>Auto-approve tools</span>
        </label>
        <button id="reset" class="ghost" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          New chat
        </button>
      </div>
    </header>

    <main id="log" aria-live="polite" aria-label="Conversation"></main>

    <footer class="dock">
      <form id="chat-form" class="composer" autocomplete="off">
        <textarea id="msg" rows="1" maxlength="1000" aria-label="Your message" placeholder="Ask about weather or news in any city"></textarea>
        <button id="send" type="submit" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint">Press Enter to send, Shift+Enter for a new line</p>
    </footer>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
